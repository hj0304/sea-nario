<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>씨나리오 발표자료</title>
<style>
:root{--bg:#ffffff;--text:#1f2328;--muted:#59636e;--line:#d1d9e0;--soft:#f6f8fa;--accent:#1f6feb;--accent-tint:rgba(31,111,235,.12);--tint:#eef1f4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d1117;--text:#e6edf3;--muted:#9198a1;--line:#3d444d;--soft:#151b23;--accent:#4493f8;--accent-tint:rgba(68,147,248,.16);--tint:#1c2229}}
:root[data-theme="dark"]{--bg:#0d1117;--text:#e6edf3;--muted:#9198a1;--line:#3d444d;--soft:#151b23;--accent:#4493f8;--accent-tint:rgba(68,147,248,.16);--tint:#1c2229}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.7;font-size:16px}
main{max-width:860px;margin:0 auto;padding:48px 16px 80px}
h1{font-size:2rem;line-height:1.3;margin:0 0 8px}
h1+p{color:var(--muted);margin-top:0}
h2{font-size:1.45rem;margin:56px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
h3{font-size:1.12rem;margin:32px 0 8px}
a{color:var(--accent)}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:.92rem;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:600}
figure{margin:24px 0;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
figcaption{color:var(--muted);font-size:.85rem;text-align:center;margin-top:8px}
svg.loop{width:100%;height:auto;display:block}
svg .ink{fill:var(--text)} svg .quiet{fill:var(--muted)} svg .edge{stroke:var(--muted)} svg .arrowhead{fill:var(--muted)}
svg .tint{fill:var(--tint)} svg .accent{fill:var(--accent-tint);stroke:var(--accent)}
li{margin:4px 0}
blockquote{margin:16px 0;padding:4px 20px;border-left:4px solid var(--accent);background:var(--soft);border-radius:0 8px 8px 0}
@media print{main{max-width:none;padding:0}h2{break-after:avoid}table,figure{break-inside:avoid}}
nav.tabs{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs div{max-width:860px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
nav.tabs a{padding:12px 14px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current]{color:var(--text);border-bottom-color:var(--accent)}
@media (max-width:480px){nav.tabs a{padding:12px 10px}}
body.wide main,body.wide nav.tabs div{max-width:1200px}
img.shot{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px}
.slides{display:flex;flex-direction:column;gap:16px;margin-top:24px}
.btn{display:inline-block;padding:10px 18px;border-radius:8px;background:var(--accent);color:var(--bg);text-decoration:none;font-weight:600}
</style>
</head>
<body class="wide">
<nav class="tabs"><div><a href="./summary.html">한 장 요약</a><a href="./">전체 기획안</a><a href="./mockup.html">데모</a><a href="./deck.html" aria-current="page">발표자료</a></div></nav>
