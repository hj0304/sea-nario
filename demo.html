<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>씨나리오 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
@font-face{font-family:"Pretendard Local";src:url("../../assets/PretendardVariable.ttf") format("truetype");font-weight:45 920;font-display:swap}
:root{
  --blue:#0b6bcb;--blue-d:#0a5db0;--blue-soft:#e8f3ff;
  --ink:#191f28;--ink2:#4e5968;--gray:#8b95a1;--line:#e5e8eb;--card:#f3f5f8;
  --pass:#16a34a;--pass-soft:#e9f7ef;--warn:#f59e0b;--warn-ink:#b45309;--warn-soft:#fff6e5;--fail:#dc2626;--fail-soft:#fdecec;
  --font:"Pretendard Local","Pretendard Variable",Pretendard,"Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#eef1f4;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
svg text{font-family:var(--font)}
#stage{position:absolute;left:50%;top:50%;width:1440px;height:900px;transform:translate(-50%,-50%) scale(var(--s,1));background:#fff;overflow:hidden}

/* chrome */
#bar{position:absolute;left:0;right:0;top:0;height:5px;background:#eef1f4;z-index:10;transition:opacity .3s}
#barFill{display:block;height:100%;width:0;background:var(--blue);border-radius:0 3px 3px 0;transition:width .6s cubic-bezier(.3,.8,.3,1)}
#back{position:absolute;left:28px;top:30px;width:52px;height:52px;border:0;border-radius:14px;background:transparent;display:grid;place-items:center;z-index:10;transition:background .2s,opacity .3s}
#back:hover{background:var(--card)}
#note{position:absolute;right:32px;top:40px;font-size:13px;color:#b0b8c1;z-index:10;font-weight:500}
#steps{position:absolute;left:50%;top:38px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;z-index:10;font-size:16px;font-weight:600;color:#b0b8c1;white-space:nowrap;transition:opacity .3s}
#steps span{transition:color .3s}
#steps span.done{color:#8b95a1}
#steps span.on{color:var(--blue);font-weight:700}
#steps i{width:4px;height:4px;border-radius:50%;background:#d1d6db}
.hide{opacity:0!important;pointer-events:none}
#cta{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);width:600px;height:80px;border:0;border-radius:22px;background:var(--blue);color:#fff;font-size:26px;font-weight:700;letter-spacing:-.01em;z-index:10;transition:background .25s,color .25s}
#cta:hover{background:var(--blue-d)}
#cta.busy{background:var(--blue-soft);color:var(--blue);cursor:default}

/* screens */
.scr{position:absolute;inset:0;padding:104px 0 172px;display:flex;flex-direction:column;align-items:center;opacity:0;visibility:hidden;transform:translateX(56px);transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1),visibility 0s .55s}
.scr.on{opacity:1;visibility:visible;transform:none;transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1),visibility 0s}
.scr.past{transform:translateX(-56px)}
.h1{margin:0;font-size:54px;line-height:1.3;font-weight:700;letter-spacing:-.03em;text-align:center}
.h1 em{font-style:normal;color:var(--blue)}
.h1 .f{color:var(--fail)}
.sub{margin-top:16px;font-size:24px;line-height:1.4;color:var(--gray);font-weight:500;text-align:center;letter-spacing:-.01em}
.vis{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:28px;min-height:0}
.scr.on .h1{animation:up .6s .05s both}
.scr.on .sub{animation:up .6s .14s both}
.scr.on .vis{animation:up .7s .22s both}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
@keyframes pop{40%{transform:scale(1.18)}}
.card{background:var(--card);border-radius:24px}
.chip{display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:999px;font-size:20px;font-weight:700;background:var(--blue-soft);color:var(--blue);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn-ink)}
.chip.fail{background:var(--fail-soft);color:var(--fail)}
.chip.pass{background:var(--pass-soft);color:var(--pass)}
.chip.gray{background:#eef1f4;color:var(--ink2)}
.mapbox{position:relative;width:1200px;border-radius:24px;overflow:hidden;background:#e8f1fb}
.mapbox>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mapbox .sea3d{position:absolute;inset:0}
.sb{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;font-size:21px;font-weight:800;color:#fff;background:#6b7684;flex:none}
.sb.own{background:var(--blue)}

/* 0 cover */
#s0{justify-content:center;padding-bottom:120px}
.logo{width:104px;height:104px;border-radius:30px;background:var(--blue);display:grid;place-items:center;box-shadow:0 18px 40px -18px rgba(11,107,203,.7)}
.cover-t{margin:36px 0 0;font-size:104px;line-height:1;font-weight:800;letter-spacing:-.045em}
.cover-s{margin-top:28px;font-size:32px;font-weight:500;color:var(--ink2);letter-spacing:-.02em}
.cover-s b{color:var(--blue);font-weight:700}
.scr.on .logo{animation:up .6s both}
.scr.on .cover-t{animation:up .6s .1s both}
.scr.on .cover-s{animation:up .6s .2s both}

.s1c{--sc:#0b6bcb;--sc-soft:#e8f3ff}
.s2c{--sc:#7c4dff;--sc-soft:#f0ebff}
.stb{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;font-size:19px;font-weight:800;color:#fff;background:var(--sc);flex:none}
.pill{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border-radius:12px;font-size:21px;font-weight:800;color:#fff;white-space:nowrap}
.pill.pass{background:var(--pass)}.pill.fail{background:var(--fail)}.pill.warn{background:var(--warn)}.pill.na{background:#a7b1bc}
.prov{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:9px;font-size:16px;font-weight:700;background:var(--warn-soft);color:var(--warn-ink)}
#toast{position:absolute;left:50%;top:84px;transform:translate(-50%,-16px);opacity:0;background:var(--ink);color:#fff;height:56px;padding:0 26px;border-radius:999px;font-size:21px;font-weight:600;display:flex;align-items:center;gap:10px;transition:all .45s;z-index:20;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* 1 문제 카드 */
#s1 .vis{margin-top:24px}
.prob{display:flex;gap:24px;align-items:stretch}
.tbl{width:820px;padding:6px 0}
.tr{display:grid;grid-template-columns:300px 130px 120px 110px 90px;align-items:center;height:72px;padding:0 26px;font-size:22px;font-weight:600;color:var(--ink2);letter-spacing:-.02em;white-space:nowrap}
.tr+.tr{border-top:1px solid var(--line)}
.tr.hd{height:48px;font-size:18px;color:var(--gray);font-weight:600}
.tr .nm{display:flex;align-items:center;gap:14px;color:var(--ink);font-weight:700}
.tr .r{text-align:right}
.tr.me .nm{color:var(--blue)}
.pic{width:376px;padding:16px;display:flex}
.pic svg{display:block;width:100%;height:100%;border-radius:16px}
.conds{display:flex;gap:10px;margin-top:18px;flex-wrap:nowrap}
.cond{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-size:18px;font-weight:600;color:var(--ink2);white-space:nowrap}
.cond b{color:var(--gray);font-weight:600}
.cond.rp{box-shadow:none;background:var(--blue-soft);color:var(--blue);font-weight:700}
.cond.ex{box-shadow:none;background:var(--warn-soft);color:var(--warn-ink);font-weight:700}

/* 2 판단 비교 */
.cmp{display:flex;gap:24px}
.sc{width:560px;padding:8px 0 10px;border-radius:24px;background:var(--card);position:relative;overflow:hidden}
.sc::before{content:"";position:absolute;left:0;top:0;right:0;height:6px;background:var(--sc)}
.sc .hd{display:flex;align-items:center;gap:14px;height:84px;padding:6px 30px 0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.sc .hd small{font-size:18px;font-weight:600;color:var(--gray);margin-left:auto}
.sr{padding:16px 30px;border-top:1px solid var(--line)}
.sr .k{font-size:18px;font-weight:600;color:var(--gray)}
.sr .v{margin-top:6px;font-size:26px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.sr .v em{font-style:normal;color:var(--sc)}
.sr .v.big{font-size:34px}
.sr .pr{display:flex;align-items:center;gap:10px;margin-top:8px}
.sr .pr .sb{width:38px;height:38px;font-size:19px}
.sr .pr .ar{color:#c5ccd3;font-weight:600}
.sr .pr .sb.dim{background:#d1d6db}
.same{margin-top:22px;display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600;color:var(--ink2)}
.same .ic{width:30px;height:30px;border-radius:9px;background:var(--blue-soft);display:grid;place-items:center}
.scr.on .sc.s1c{animation:up .55s .2s both}.scr.on .sc.s2c{animation:up .55s .45s both}.scr.on .same{animation:up .5s .8s both}

/* 3 위험 변화 */
#s3 .vis{margin-top:22px}
#map3{height:452px}
.cap{display:flex;align-items:center;justify-content:center;gap:14px;height:52px;margin-top:16px;font-size:27px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.cap .tm{color:var(--blue);font-weight:700;font-size:24px}
.cap .tx{color:var(--ink)}
.cap.fx{animation:capin .4s both}
@keyframes capin{from{opacity:0;transform:translateY(8px)}}
.cap .chip{transition:opacity .3s,transform .3s}
.cap .chip.off{opacity:0;transform:scale(.8);width:0;padding:0;margin-left:-14px;overflow:hidden}
.cap .chip:not(.off){animation:pop .5s}
.hud{position:absolute;left:18px;top:18px;background:rgba(255,255,255,.95);border-radius:16px;padding:12px 16px 8px;box-shadow:0 6px 18px -10px rgba(25,31,40,.35);font-size:17px;font-weight:600;color:var(--ink2);z-index:2;width:272px}
.hud .hh{font-size:14px;color:var(--gray);margin-bottom:4px;display:flex;align-items:center}
.hud .hh span{margin-left:auto;display:flex;gap:6px}
.hud .hh .stb{width:52px;height:22px;border-radius:7px;font-size:13px}
.hud .hr{display:flex;align-items:center;gap:8px;height:34px}
.hud .hr .sb{width:24px;height:24px;border-radius:7px;font-size:14px}
.hud .hr .vv{margin-left:auto;display:flex;gap:6px}
.hud .hr .vv b{width:52px;text-align:center;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums;border-radius:7px}
.hud .hr .vv b.bad{color:#fff;background:var(--fail)}
.hud .ft{font-size:13px;color:var(--gray);margin-top:2px}
.lgd{position:absolute;right:18px;bottom:14px;display:flex;gap:16px;font-size:16px;font-weight:600;color:var(--ink2);background:rgba(255,255,255,.92);padding:8px 14px;border-radius:12px;z-index:2}
.lgd span{display:flex;align-items:center;gap:7px}
.lgd i{display:inline-block;width:24px;height:0;border-top:3px dashed #8b95a1}
.lgd i.s1{border-top:4px solid #0b6bcb}.lgd i.s2{border-top:4px solid #7c4dff}
.lgd i.z{width:15px;height:15px;border:2px dashed #8b95a1;border-radius:50%}
.rptag{position:absolute;right:18px;top:16px;z-index:2;display:flex;gap:8px}
.rptag span{height:30px;padding:0 12px;border-radius:9px;background:rgba(255,255,255,.92);font-size:15px;font-weight:700;color:var(--blue);display:inline-flex;align-items:center}

/* 4 결과 리포트 */
#s4 .vis{margin-top:20px}
.states{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;color:var(--gray);margin-bottom:16px}
.states .st{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:9px;background:var(--card)}
.states .st i{width:10px;height:10px;border-radius:50%}
.rep{display:grid;grid-template-columns:190px 500px 500px;width:1190px;border-radius:24px;background:var(--card);overflow:hidden}
.rep>div{padding:14px 24px;border-top:1px solid var(--line);min-height:104px;display:flex;flex-direction:column;justify-content:center}
.rep>.hc{min-height:72px;border-top:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;font-size:23px;font-weight:800;letter-spacing:-.02em}
.rep>.hc .pill{margin-left:auto}
.rep>.lay{font-size:21px;font-weight:700;color:var(--ink);justify-content:center}
.rep>.lay small{display:block;font-size:15px;font-weight:600;color:var(--gray);margin-top:4px;line-height:1.35}
.rep>.lay.l1{background:#fff7f7}
.cl .m{font-size:23px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.cl .d{font-size:17px;font-weight:600;color:var(--gray);margin-top:6px;white-space:nowrap}
.cl .m.ng{color:var(--fail)}.cl .m.ok{color:var(--pass)}.cl .m.mu{color:var(--gray)}
.cl .tag{font-size:14px;font-weight:700;height:26px;padding:0 9px;border-radius:8px;background:#fff;color:var(--gray);display:inline-flex;align-items:center}
.rep .c1.l1{background:#fff3f3}
.repnote{margin-top:14px;font-size:17px;font-weight:600;color:var(--gray)}
.scr.on .rep>div{animation:up .45s both}
.scr.on .rep>.r2{animation-delay:.3s}.scr.on .rep>.r3{animation-delay:.55s}.scr.on .rep>.r4{animation-delay:.8s}

/* 5 오답 재시험 */
#s5 .vis{margin-top:22px}
.rt{display:flex;gap:24px;align-items:stretch}
.rtc{width:760px;padding:6px 0 12px}
.rtc .ch{display:flex;align-items:center;gap:8px;height:56px;padding:0 28px;font-size:16px;font-weight:600;color:var(--gray);white-space:nowrap}
.rtc .ch b{color:var(--ink2);font-weight:700}
.rv{display:flex;align-items:center;gap:16px;height:84px;margin:0 14px;padding:0 20px;border-radius:18px;background:#fff;font-size:24px;font-weight:700;white-space:nowrap}
.rv .who{display:flex;align-items:center;gap:10px;width:200px}
.rv .who small{font-size:16px;color:var(--gray);font-weight:600}
.rv .d{font-size:20px;font-weight:600;color:var(--ink2)}
.rv .d.ng{color:var(--fail)}
.rarr{height:34px;display:grid;place-items:center}
.dl{margin:14px 14px 0;padding:6px 20px;border-radius:18px;background:#fff}
.dr{display:flex;align-items:center;gap:14px;height:60px;font-size:21px;font-weight:600;color:var(--ink);white-space:nowrap}
.dr+.dr{border-top:1px solid var(--line)}
.dr .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.dr.ok .ic{background:var(--pass)}.dr.wn .ic{background:var(--warn)}
.dr .k{width:72px;font-size:17px;color:var(--gray);font-weight:700}
.rtm{width:404px;padding:16px;display:flex;flex-direction:column}
.rtm svg{display:block;width:100%;flex:1;border-radius:16px}
.rtm .lg{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:15px;font-weight:600;color:var(--ink2)}
.rtm .lg span{display:flex;align-items:center;gap:6px}
.rtm .lg i{display:inline-block;width:22px;border-top:3px dashed #e57373}
.rtm .lg i.n{border-top:4px solid #0b6bcb}
.scr.on .rv.v1{animation:up .5s .2s both}.scr.on .rarr{animation:up .5s .5s both}.scr.on .rv.v2{animation:up .5s .7s both}.scr.on .dl{animation:up .5s 1s both}

/* loop overlay */
#loopFx{position:absolute;inset:0;z-index:30;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
#loopFx.show{opacity:1;visibility:visible;transition:opacity .35s,visibility 0s}
#loopFx svg{width:150px;height:150px}
#loopFx .arc{stroke-dasharray:480;stroke-dashoffset:480}
#loopFx.show .arc{animation:arc 1s .1s cubic-bezier(.5,0,.3,1) forwards}
@keyframes arc{to{stroke-dashoffset:0}}
#loopFx .lt{font-size:44px;font-weight:700;letter-spacing:-.03em}

/* ---- v10 추가: 지도·옵션·문제 전환·재시험 ---- */
.sea3d canvas{display:block;position:absolute;left:0;top:0}
.sea2d canvas{cursor:grab;touch-action:none}
.sea3d-labels{position:absolute!important;inset:0;pointer-events:none}
.lbl>span{display:inline-block;transform:translateY(-12px);font:700 13px/1 var(--font);padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.93);color:#4e5968;white-space:nowrap}
.lbl.own>span{background:var(--c);color:#fff}
.lbl.warn>span{background:var(--fail);color:#fff}
.camb{position:absolute;right:14px;top:14px;z-index:3;display:flex;gap:6px}
.camb button{height:34px;padding:0 12px;border:0;border-radius:10px;background:rgba(255,255,255,.92);font-size:14px;font-weight:700;color:var(--ink2);box-shadow:0 2px 8px -4px rgba(25,31,40,.35)}
.camb button.on{background:var(--ink);color:#fff}
.psw{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.psw button{height:40px;padding:0 18px;border:0;border-radius:999px;background:var(--card);font-size:16px;font-weight:700;color:var(--ink2)}
.psw button.on{background:var(--ink);color:#fff}
.pic .mapbox{width:100%;height:100%;border-radius:16px}
.cond.fl{box-shadow:none;background:var(--fail-soft);color:var(--fail);font-weight:700}
/* 2 판단 비교 */
.cmp2{display:flex;gap:24px;align-items:stretch}
.cols{width:540px;display:flex;flex-direction:column;gap:16px}
.cols .sc{width:auto;flex:1;padding:2px 0 4px}
.cols .sc .hd{height:52px;font-size:22px}
.h1 .p{color:var(--pass)}
.hud{width:340px!important}
.hud .hr .nm{max-width:190px!important}
.mnote{position:absolute;left:14px;bottom:12px;z-index:2;font-size:14px;font-weight:600;color:var(--ink2);background:rgba(255,255,255,.92);padding:6px 12px;border-radius:10px}
.sc .opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 24px;border-top:1px solid var(--line);min-height:46px}
.sc .opt .k{font-size:17px;font-weight:600;color:var(--gray);white-space:nowrap}
.seg{display:flex;background:#e3e8ee;border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;height:36px;padding:0 12px;border-radius:9px;font-size:15px;font-weight:700;color:var(--ink2);white-space:nowrap}
.seg button.on{background:#fff;color:var(--sc);box-shadow:0 1px 4px rgba(25,31,40,.15)}
.rng{display:flex;align-items:center;gap:10px}
.rng input{width:170px;accent-color:var(--sc)}
.rng .val{min-width:70px;text-align:right;font-size:17px;font-weight:800;color:var(--ink)}
.sc .act{padding:8px 24px 2px;border-top:1px solid var(--line)}
.sc .act .k{font-size:15px;font-weight:600;color:var(--gray);display:flex;align-items:center;gap:8px}
.sc .act .v{margin-top:0;font-size:25px;font-weight:800;letter-spacing:-.02em;color:var(--sc);white-space:nowrap}
.sc .act .w{margin-top:2px;font-size:16px;font-weight:600;color:var(--ink2);white-space:nowrap}
.sc .more{border:0;background:transparent;font-size:14px;font-weight:700;color:var(--gray);margin-left:auto;padding:4px 8px;border-radius:8px}
.sc .more:hover{background:#e7ebf0}
.calc{font-style:normal;font-size:12px;font-weight:700;color:var(--pass);background:var(--pass-soft);padding:2px 7px;border-radius:6px}
.m2{width:800px}
.scr.on .cols .sc.s1c{animation:up .5s .15s both}.scr.on .cols .sc.s2c{animation:up .5s .3s both}
/* 3 위험 변화 HUD 이름 */
.hud .hr .nm{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 4 리포트 버튼 */
.repbtn{margin-top:14px;display:flex;gap:10px;align-items:center;justify-content:center}
.btn2{height:40px;padding:0 16px;border:0;border-radius:12px;background:var(--card);font-size:16px;font-weight:700;color:var(--ink2)}
.btn2:hover{background:#e7ebf0}
/* 5 재시험 */
.sgh{margin:16px 20px 0;font-size:17px;font-weight:700;color:var(--ink2)}

<!-- 3D 보기(?view=3d)일 때만 모듈로 실행 -->
<script type="text/plain" id="v3src">
/* =====================================================================
   3D 해역 뷰 (Three.js). 좌표: 1 단위 = 1해리, X 동쪽, -Z 북쪽, Y 위
   window.SeaView3D = class, 준비되면 "seaview-ready" 이벤트
   ===================================================================== */
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { Line2 } from "three/addons/lines/Line2.js";
import { LineMaterial } from "three/addons/lines/LineMaterial.js";
import { LineGeometry } from "three/addons/lines/LineGeometry.js";

const DEG = Math.PI / 180;
const SHIP_SCALE = 6;          // 선박은 보기 쉽게 6배 확대
const SEA = 0xcfe3f6, SKY = 0xeef5fc;

function waterNormals(size) {
  const data = new Uint8Array(size * size * 4);
  const waves = [[3, 1, .9], [1, 4, .7], [5, -2, .5], [-2, 7, .35], [9, 3, .25]];
  for (let j = 0; j < size; j++) for (let i = 0; i < size; i++) {
    let dx = 0, dy = 0;
    for (const [a, b, amp] of waves) {
      const ph = 2 * Math.PI * (a * i + b * j) / size, c = Math.cos(ph) * amp;
      dx += c * a; dy += c * b;
    }
    const n = new THREE.Vector3(-dx * .05, -dy * .05, 1).normalize(), k = (j * size + i) * 4;
    data[k] = (n.x * .5 + .5) * 255; data[k + 1] = (n.y * .5 + .5) * 255; data[k + 2] = (n.z * .5 + .5) * 255; data[k + 3] = 255;
  }
  const tex = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.needsUpdate = true;
  return tex;
}

function hullShape(L, B) {
  const s = new THREE.Shape();
  s.moveTo(0, L / 2);
  s.bezierCurveTo(B * .42, L * .36, B / 2, L * .2, B / 2, L * .05);
  s.lineTo(B / 2, -L * .42); s.quadraticCurveTo(B / 2, -L / 2, B * .3, -L / 2);
  s.lineTo(-B * .3, -L / 2); s.quadraticCurveTo(-B / 2, -L / 2, -B / 2, -L * .42);
  s.lineTo(-B / 2, L * .05); s.bezierCurveTo(-B / 2, L * .2, -B * .42, L * .36, 0, L / 2);
  return s;
}
function extrude(shape, h, mat) {
  const g = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false, curveSegments: 10 });
  g.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, mat); m.castShadow = true; return m;
}
function box(w, h, l, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, l), mat); m.position.set(x, y + h / 2, z); m.castShadow = true; return m;
}
const CONT = [0xd9534f, 0x3f7fbf, 0xe8a33d, 0x4c9f70, 0x8a6bbf, 0xc9ced6, 0x2f6f8f];

// 선박 모델: bow → -Z
function makeShip(type, lenM, beamM, color, opts = {}) {
  const L = Math.max(.2, lenM / 1852 * SHIP_SCALE), B = Math.max(.045, (beamM || lenM / 7) / 1852 * SHIP_SCALE * 1.15);
  const g = new THREE.Group();
  const T = opts.ghost ? { transparent: true, opacity: .45, depthWrite: false } : {};
  const hullMat = new THREE.MeshStandardMaterial(Object.assign({ color, roughness: .55, metalness: .05 }, T));
  const deckMat = new THREE.MeshStandardMaterial(Object.assign({ color: 0xf4f6f8, roughness: .7 }, T));
  const darkMat = new THREE.MeshStandardMaterial(Object.assign({ color: 0x46505c, roughness: .6 }, T));
  const H = Math.max(.018, B * .38);
  g.add(extrude(hullShape(L, B), H, hullMat));
  const top = H;
  if (type === "container") {
    const rows = 7, len = L * .62, w = B * .78;
    for (let r = 0; r < rows; r++) {
      const z = -L * .32 + (r + .5) * len / rows + L * .02;
      const h = H * (1.1 + ((r * 37) % 3) * .25);
      const mat = new THREE.MeshStandardMaterial(Object.assign({ color: CONT[(r * 3 + (opts.seed || 0)) % CONT.length], roughness: .8 }, T));
      g.add(box(w, h, len / rows * .9, mat, 0, top, z));
    }
    g.add(box(B * .82, H * 2.2, L * .07, deckMat, 0, top, L * .36));
  } else if (type === "warship") {
    g.add(box(B * .62, H * 1.4, L * .26, new THREE.MeshStandardMaterial(Object.assign({ color: 0x9aa6b2, roughness: .6 }, T)), 0, top, -L * .02));
    g.add(box(B * .4, H * 1.2, L * .1, new THREE.MeshStandardMaterial(Object.assign({ color: 0xaab4bf, roughness: .6 }, T)), 0, top + H * 1.4, -L * .04));
    g.add(box(B * .5, H * .9, L * .16, new THREE.MeshStandardMaterial(Object.assign({ color: 0x9aa6b2, roughness: .6 }, T)), 0, top, L * .2));
    const mast = new THREE.Mesh(new THREE.CylinderGeometry(B * .03, B * .05, H * 3.2), darkMat); mast.position.set(0, top + H * 2.2, -L * .02); g.add(mast);
  } else if (type === "tug") {
    g.add(box(B * .7, H * 1.5, L * .3, deckMat, 0, top, -L * .12));
    g.add(box(B * .5, H * 1, L * .18, deckMat, 0, top + H * 1.5, -L * .14));
  } else if (type === "fishing") {
    g.add(box(B * .7, H * 1.4, L * .26, deckMat, 0, top, L * .1));
    const mast = new THREE.Mesh(new THREE.CylinderGeometry(B * .04, B * .05, H * 4), darkMat); mast.position.set(0, top + H * 2, -L * .18); g.add(mast);
  } else if (type === "lpg" || type === "tanker") { // 일반 탱커 모양 (탱크 형식은 표현하지 않음)
    g.add(box(B * .56, H * .5, L * .62, new THREE.MeshStandardMaterial(Object.assign({ color: 0xc9d1da, roughness: .7 }, T)), 0, top, -L * .06));
    g.add(box(B * .1, H * .55, L * .6, darkMat, 0, top + H * .5, -L * .06));
    g.add(box(B * .74, H * .8, L * .05, darkMat, 0, top, -L * .1));
    g.add(box(B * .82, H * 2.2, L * .09, deckMat, 0, top, L * .37));
  } else { // cargo / bulk / tanker / ferry
    const n = 5;
    for (let i = 0; i < n; i++) g.add(box(B * .66, H * .5, L * .1, darkMat, 0, top, -L * .33 + i * L * .13));
    g.add(box(B * .82, H * 2.2, L * .08, deckMat, 0, top, L * .37));
  }
  g.userData.hullMat = hullMat; g.userData.baseColor = new THREE.Color(color); g.userData.L = L;
  return g;
}

function lineMat(color, width, dashed, opacity = 1) {
  const m = new LineMaterial({ color, linewidth: width, dashed: !!dashed, dashSize: .18, gapSize: .14, transparent: opacity < 1, opacity, worldUnits: false });
  if (dashed) m.defines.USE_DASH = "";
  return m;
}
function mkLine(pts, mat) {
  const g = new LineGeometry(); g.setPositions(pts);
  const l = new Line2(g, mat); l.computeLineDistances(); l.renderOrder = 2; return l;
}
function flat(track, y = .004) { const a = []; for (const p of track) a.push(p.x, y, -p.y); return a; }
function label(text, cls) {
  const d = document.createElement("div"); d.className = "lbl " + (cls || "");
  const sp = document.createElement("span"); sp.textContent = text; d.appendChild(sp);
  const o = new CSS2DObject(d); o.span = sp; return o;
}

class SeaView3D {
  constructor(opts = {}) {
    this.getScale = opts.getScale || (() => 1);
    const el = this.el = document.createElement("div"); el.className = "sea3d";
    const r = this.renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    r.setClearColor(SKY); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
    r.outputColorSpace = THREE.SRGBColorSpace;
    el.appendChild(r.domElement);
    const lr = this.labels = new CSS2DRenderer(); lr.domElement.className = "sea3d-labels"; el.appendChild(lr.domElement);
    const sc = this.scene = new THREE.Scene(); sc.background = new THREE.Color(SKY); sc.fog = new THREE.Fog(SKY, 30, 80);
    this.camera = new THREE.PerspectiveCamera(38, 1.6, .05, 400);
    this.controls = new OrbitControls(this.camera, r.domElement);
    Object.assign(this.controls, { enableDamping: true, dampingFactor: .08, maxPolarAngle: 1.45, minDistance: 1.2, maxDistance: 60, screenSpacePanning: false });
    this.controls.addEventListener("start", () => { if (this.mode === "chase") this.mode = "free"; this.onUser && this.onUser(); });
    sc.add(new THREE.HemisphereLight(0xffffff, 0xb9d3ec, 1.6));
    const sun = this.sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(-8, 14, 6); sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 60 });
    sun.shadow.bias = -.0005; sc.add(sun); sc.add(sun.target);
    this.normals = waterNormals(256); this.normals.repeat.set(40, 40);
    const sea = this.sea = new THREE.Mesh(new THREE.PlaneGeometry(400, 400),
      new THREE.MeshStandardMaterial({ color: SEA, roughness: .42, metalness: .05, normalMap: this.normals, normalScale: new THREE.Vector2(.35, .35) }));
    sea.rotation.x = -Math.PI / 2; sea.receiveShadow = true; sc.add(sea);
    this.world = new THREE.Group(); sc.add(this.world);
    this.mode = "oblique"; this.t = 0; this.data = null; this.clock = new THREE.Clock();
    this._loop = this._loop.bind(this); requestAnimationFrame(this._loop);
    this._ro = new ResizeObserver(() => this.resize()); this._ro.observe(el);
  }
  mount(container) { if (this.el.parentNode !== container) container.appendChild(this.el); this.resize(); }
  resize() {
    const w = this.el.clientWidth, h = this.el.clientHeight; if (!w || !h) return;
    const pr = Math.min(2.5, (window.devicePixelRatio || 1) * this.getScale());
    this.renderer.setPixelRatio(pr); this.renderer.setSize(w, h, false);
    this.renderer.domElement.style.width = w + "px"; this.renderer.domElement.style.height = h + "px";
    this.labels.setSize(w, h); this.camera.aspect = w / h; this.camera.updateProjectionMatrix();
    this.lineMats && this.lineMats.forEach(m => m.resolution.set(w * pr, h * pr));
    this.size = [w, h];
  }
  _reg(m) { this.lineMats.push(m); const s = this.size || [800, 500], pr = this.renderer.getPixelRatio(); m.resolution.set(s[0] * pr, s[1] * pr); return m; }

  /* d = {dt, safe, targets:[{id,name,kind,type,len,beam,track}], owns:[{key,label,color,type,len,beam,track,ghost,planned}], markers:[{x,y,text,until}], grid:true} */
  setData(d) {
    const W = this.world;
    W.traverse(o => { if (o.element && o.element.parentNode) o.element.parentNode.removeChild(o.element); });
    while (W.children.length) W.remove(W.children[0]);
    this.lineMats = []; this.data = d;
    // 범위
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    const all = d.targets.map(t => t.track).concat(d.owns.map(o => o.track));
    all.forEach(tr => tr.forEach(p => { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }));
    // 화면 맞춤은 사건이 벌어지는 구간(focus)만 사용
    let fx0 = x0, fy0 = y0, fx1 = x1, fy1 = y1;
    if (d.box) ({ x0: fx0, y0: fy0, x1: fx1, y1: fy1 } = d.box);
    this.bounds = { x0, y0, x1, y1, cx: (fx0 + fx1) / 2, cy: (fy0 + fy1) / 2, size: Math.max(fx1 - fx0, fy1 - fy0, 3), w: fx1 - fx0, h: fy1 - fy0 };
    // 격자 (1해리)
    const gp = [], gx0 = Math.floor(x0) - 2, gx1 = Math.ceil(x1) + 2, gy0 = Math.floor(y0) - 2, gy1 = Math.ceil(y1) + 2;
    for (let x = gx0; x <= gx1; x++) gp.push(x, .001, -gy0, x, .001, -gy1);
    for (let y = gy0; y <= gy1; y++) gp.push(gx0, .001, -y, gx1, .001, -y);
    const gg = new THREE.BufferGeometry(); gg.setAttribute("position", new THREE.Float32BufferAttribute(gp, 3));
    W.add(new THREE.LineSegments(gg, new THREE.LineBasicMaterial({ color: 0xa9c7e6, transparent: true, opacity: .55 })));
    this.sun.position.set(this.bounds.cx - 8, 14, -this.bounds.cy + 6); this.sun.target.position.set(this.bounds.cx, 0, -this.bounds.cy);
    // 타선
    this.tg = d.targets.map((T, i) => {
      const line = mkLine(flat(T.track), this._reg(lineMat(0x7d8b99, 2.6, true, .95))); W.add(line);
      const ship = makeShip(T.type, T.len, T.beam, 0x6b7684, { seed: i * 2 }); W.add(ship);
      const lb = label(T.name, "tg"); lb.position.set(0, .28, 0); ship.add(lb);
      return { T, ship, lb };
    });
    // 자선(전략별)
    this.ow = d.owns.map(O => {
      const col = new THREE.Color(O.color);
      if (O.planned !== false) W.add(mkLine(flat(O.track, .006), this._reg(lineMat(col, 2.6, true, .55))));
      const trail = mkLine(flat(O.track, .008), this._reg(lineMat(col, O.ghost ? 3.4 : 5.5, !!O.ghost, O.ghost ? .85 : 1)));
      W.add(trail);

/* 판단 기록 · JSON */

var ICK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

}

SCR[0].classList.add("on"); cur = 0; updCta(); ["#bar", "#back", "#steps"].forEach(function (q) { $(q).classList.add("hide"); });
var WANT3D = QS.get("view") === "3d";

<script>
/* =====================================================================
   자동 점검 (?selftest=1): 실제 버튼·슬라이더를 눌러 두 문제의 5화면 흐름을 끝까지 진행하고
   결과를 숨긴 pre#selftest(JSON)와 문서 제목에 남김. 평소에는 실행되지 않음
   ===================================================================== */
(function () {
  "use strict";
  if (new URLSearchParams(location.search).get("selftest") !== "1") return;
  var R = [], errs = [];
  addEventListener("error", function (e) { errs.push(String(e.message)); });
  function ok(name, cond, info) { R.push({ name: name, ok: !!cond, info: info === undefined ? "" : String(info) }); }
  function W(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function until(fn, ms) { var t0 = Date.now(); while (!fn()) { if (Date.now() - t0 > ms) return false; await W(50); } return true; }
  function $(s) { return document.querySelector(s); }
  function $$(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
  function scr() { var e = document.querySelector(".scr.on"); return e && e.id; }
  async function click(el) { if (!el) throw new Error("없는 요소"); el.click(); await W(150); }
  function finish() {
    var pre = document.createElement("pre"); pre.id = "selftest"; pre.style.display = "none";
    var pass = R.length > 0 && R.every(function (r) { return r.ok; });
    pre.textContent = JSON.stringify({ pass: pass, n: R.length, fails: R.filter(function (r) { return !r.ok; }), all: R });
    document.body.appendChild(pre); document.title = "SELFTEST " + (pass ? "PASS" : "FAIL");
  }
  async function run() {
    await until(function () { return window.__demo; }, 12000);
    var D = window.__demo, cta = function () { return $("#cta"); };
    ok("지도 렌더러", D.view.kind === "2d", D.view.kind);
    await click(cta());
    for (var pi = 0; pi < 2; pi++) {
      var P = "문제" + (pi + 1) + " · ";
      // 1 문제 카드
      ok(P + "문제 카드 화면", scr() === "s1", scr());
      ok(P + "선택된 문제", D.S.pi === pi, D.S.pi);
      ok(P + "선박 표 5줄", $$("#tbl1 .tr").length === 5);
      ok(P + "문제 전환 버튼 2개", $$("#psw button").length === 2);
      var hit = await until(function () { return D.view.hitsActive > 0; }, 40000);
      ok(P + "실제 사고 재생 → 충돌 표시", hit, "t=" + D.PL.t.toFixed(1));
      // 2 판단 비교
      await click(cta()); ok(P + "판단 비교 화면", scr() === "s2", scr());
      var st1 = D.S.runs.s1.ev.status;
      ok(P + "전략 1 실패", st1 === "fail", st1); ok(P + "전략 2 통과", D.S.runs.s2.ev.status === "pass");
      var before = $("#sc1 .act .v").textContent, base = Object.assign({}, D.S.params.s1);
      await click($('#sc1 .seg button[data-k="scope"][data-v="all"]')); await W(120);
      ok(P + "옵션 변경 → 다시 계산", D.S.runs.s1.params.scope === "all" && !!$("#sc1 .calc"), before + " → " + $("#sc1 .act .v").textContent);
      ok(P + "카드 부제 갱신", /모든 배/.test($("#sc1 .hd small").textContent));
      await click($('#sc1 .seg button[data-k="scope"][data-v="' + base.scope + '"]')); await W(120);
      ok(P + "옵션 되돌리기", D.S.runs.s1.ev.status === st1 && $("#sc1 .act .v").textContent === before);
      await click($("#sc1 .more")); ok(P + "세부 옵션 열기", !!$('#sc1 input[data-k="dcpa"]'));
      var rng = $('#sc1 input[data-k="dcpa"]'); rng.value = 1.2; rng.dispatchEvent(new Event("input")); await W(150);
      ok(P + "슬라이더 → 다시 계산", D.S.runs.s1.params.dcpa === 1.2);
      rng = $('#sc1 input[data-k="dcpa"]'); rng.value = base.dcpa; rng.dispatchEvent(new Event("input")); await W(150);
      ok(P + "슬라이더 되돌리기", D.S.runs.s1.ev.status === st1);
      await click($("#sc1 .more")); ok(P + "기본 옵션으로", !!$('#sc1 .seg button[data-k="scope"]'));
      // 3 위험 변화
      await click(cta()); ok(P + "위험 변화 화면", scr() === "s3", scr());
      await click(cta()); ok(P + "실행 시작", D.PL.playing, cta().textContent);
      var ended = await until(function () { return D.S.done3; }, 90000);
      ok(P + "재생 끝까지", ended, "t=" + D.PL.t.toFixed(2) + "/" + D.PL.dur);
      ok(P + "결과 제목", /위험해졌어요/.test($("#t3").textContent), $("#t3").textContent);
      ok(P + "HUD 빨간 칸", $$("#hud3 b.bad").length > 0);
      ok(P + "자막 = 핵심 위험", /2차 충돌위험/.test($("#cap3").textContent), $("#cap3").textContent);
      // 4 결과 리포트
      await click(cta()); ok(P + "리포트 화면", scr() === "s4", scr());
      ok(P + "판정 배지", !!$("#rep .pill.fail") && !!$("#rep .pill.pass"));
      await click($("#logBtn")); ok(P + "판단 기록 창", $("#modal").classList.contains("show") && $$("#mb li").length >= 2); await click($("#mx"));
      await click($("#jsonBtn")); var js = null; try { js = JSON.parse($("#mb pre").textContent); } catch (e) {}
      ok(P + "성적표 JSON", js && js[0].result === "FAIL" && js[1].result === "PASS", js && js.map(function (x) { return x.result; }).join(",")); await click($("#mx"));
      // 5 오답 재시험
      await click(cta()); ok(P + "재시험 화면", scr() === "s5", scr());
      ok(P + "재시험 전 표시", /재시험 전/.test($("#rtc").textContent));
      var sug = $$("#rtc .sug button"); ok(P + "수정 제안", sug.length > 0, sug.map(function (b) { return b.textContent; }).join(" / "));
      await click(sug[0]); ok(P + "수정 내용 표시", !/아래에서 고칠 점/.test($("#rtc .rv.v2").textContent), $("#rtc .rv.v2 .d").textContent);
      await click(cta()); var e5 = await until(function () { return D.S.rt.done; }, 90000); ok(P + "재시험 끝까지", e5);
      ok(P + "v2 통과", D.S.rt.r2.ev.status === "pass", D.S.rt.r2.ev.status);
      R.push({ name: P + "첫 수정 회귀검증", ok: true, info: D.S.rt.reg.map(function (g) { return "문제" + g.no + ":" + g.st; }).join(" ") });
      if (D.S.rt.reg.some(function (g) { return g.st !== "pass"; })) {
        ok(P + "회귀 실패 제목", /다른 문제에서 실패/.test($("#t5").textContent), $("#t5").textContent);
        var s2b = $$("#rtc .sug button").filter(function (b) { return !b.classList.contains("used") && /모든 선박/.test(b.textContent); })[0];
        ok(P + "두 번째 제안", !!s2b);
        await click(s2b); await click(cta()); await until(function () { return D.S.rt.done; }, 90000);
      }
      ok(P + "회귀검증 모두 통과", D.S.rt.reg.every(function (g) { return g.st === "pass"; }), D.S.rt.reg.map(function (g) { return "문제" + g.no + ":" + g.st; }).join(" "));
      ok(P + "재시험 제목", /통과했어요/.test($("#t5").textContent), $("#t5").textContent);
      await click($("#back")); ok(P + "뒤로 → 리포트", scr() === "s4"); await click(cta());
      ok(P + "다시 재시험 화면", scr() === "s5" && /다음 문제로/.test(cta().textContent), cta().textContent);
      await click(cta());
      await until(function () { return scr() === "s1" && !$("#loopFx").classList.contains("show"); }, 6000);
      ok(P + "다음 문제로 순환", D.S.pi === (pi + 1) % 2 && scr() === "s1", D.S.pi);
    }
    ok("스크립트 오류 없음", errs.length === 0, errs.join(" | "));
  }
  run().catch(function (e) { errs.push("run: " + e.message); ok("점검 중단", false, e.message); }).then(finish);
})();

</script>
</body>
</html>
